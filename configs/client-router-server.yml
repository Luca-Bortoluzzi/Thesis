lab_name: client-router-server

description: semplice topologia con LAN e DMZ 

metadata:
  description: "Multi-AS BGP topology"
  version: 2.0
  author: "Luca-Bortoluzzi"
  email: "luca.bortoluzzi921@edu.unito.it"
  web: "http://www.kathara.org/"

nodes:
  client:
    type: host
    interfaces:
      - network: lan1
        ip: 10.0.1.10/24
    default_gateway: 10.0.1.1

  router:
    type: router
    interfaces:
      - network: lan1
        ip: 10.0.1.1/24
      - network: dmz
        ip: 10.0.2.1/24

  server:
    type: host
    interfaces:
      - network: dmz
        ip: 10.0.2.10/24
    default_gateway: 10.0.2.1
