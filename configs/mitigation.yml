lab_name: mitigation

description: >
  Controlled DoS mitigation laboratory. It preserves the client, routing, and
  attacker structure of dos_lab while placing a rate-limiting TCP reverse proxy
  in front of a server located on a private, non-routed backend network.

metadata:
  description: "Enterprise DoS mitigation with a rate-limiting reverse proxy"
  version: 1.0
  author: "Luca-Bortoluzzi"
  email: "luca.bortoluzzi921@edu.unito.it"
  web: "http://www.kathara.org/"

nodes:

  # Legitimate user LAN A
  pc_a1:
    type: host
    interfaces:
      - network: lan_a
        ip: 10.10.1.10/24
    default_gateway: 10.10.1.1

  pc_a2:
    type: host
    interfaces:
      - network: lan_a
        ip: 10.10.1.11/24
    default_gateway: 10.10.1.1

  pc_a3:
    type: host
    interfaces:
      - network: lan_a
        ip: 10.10.1.12/24
    default_gateway: 10.10.1.1

  pc_a4:
    type: host
    interfaces:
      - network: lan_a
        ip: 10.10.1.13/24
    default_gateway: 10.10.1.1

  # Legitimate user LAN B
  pc_b1:
    type: host
    interfaces:
      - network: lan_b
        ip: 10.10.2.10/24
    default_gateway: 10.10.2.1

  pc_b2:
    type: host
    interfaces:
      - network: lan_b
        ip: 10.10.2.11/24
    default_gateway: 10.10.2.1

  pc_b3:
    type: host
    interfaces:
      - network: lan_b
        ip: 10.10.2.12/24
    default_gateway: 10.10.2.1

  pc_b4:
    type: host
    interfaces:
      - network: lan_b
        ip: 10.10.2.13/24
    default_gateway: 10.10.2.1

  # Attacker and controlled zombie network
  attacker:
    type: host
    interfaces:
      - network: lan_attackers
        ip: 10.20.1.10/24
    default_gateway: 10.20.1.1

  zombie_1:
    type: host
    interfaces:
      - network: lan_attackers
        ip: 10.20.1.11/24
    default_gateway: 10.20.1.1
    commands:
      - python3 /hostlab/zombie_1/zombie.py > /tmp/zombie.log 2>&1 &

  zombie_2:
    type: host
    interfaces:
      - network: lan_attackers
        ip: 10.20.1.12/24
    default_gateway: 10.20.1.1
    commands:
      - python3 /hostlab/zombie_2/zombie.py > /tmp/zombie.log 2>&1 &

  zombie_3:
    type: host
    interfaces:
      - network: lan_attackers
        ip: 10.20.1.13/24
    default_gateway: 10.20.1.1
    commands:
      - python3 /hostlab/zombie_3/zombie.py > /tmp/zombie.log 2>&1 &

  # Public server endpoint implemented by the reverse proxy
  server:
    type: host
    interfaces:
      - network: dmz_public
        ip: 10.30.1.10/24
      - network: backend_service
        ip: 10.30.2.1/24
    default_gateway: 10.30.1.1
    commands:
      - PROXY_BACKEND_HOST=10.30.2.10 PROXY_MAX_PER_SOURCE=2 PROXY_MAX_ACTIVE=32 python3 /hostlab/server/reverse_proxy.py > /tmp/reverse_proxy.log 2>&1 &

  # Private application server, unreachable from the routed network
  backend_server:
    type: host
    interfaces:
      - network: backend_service
        ip: 10.30.2.10/24
    default_gateway: 10.30.2.1
    commands:
      - SERVICE_MAX_ACTIVE=20 SERVICE_BACKLOG=20 python3 /hostlab/backend_server/service.py > /tmp/service.log 2>&1 &

  # Enterprise routing core, identical to the unmitigated lab
  r1:
    type: router
    interfaces:
      - network: lan_a
        ip: 10.10.1.1/24
      - network: r1_r2
        ip: 10.0.12.1/30
      - network: r1_r3
        ip: 10.0.13.1/30
    frr:
      enabled: true
      protocol: ospf
      router_id: 1.1.1.1
      area: 0

  r2:
    type: router
    interfaces:
      - network: lan_b
        ip: 10.10.2.1/24
      - network: r1_r2
        ip: 10.0.12.2/30
      - network: r2_r4
        ip: 10.0.24.1/30
      - network: r2_core
        ip: 10.0.25.1/30
    frr:
      enabled: true
      protocol: ospf
      router_id: 2.2.2.2
      area: 0

  r3:
    type: router
    interfaces:
      - network: r1_r3
        ip: 10.0.13.2/30
      - network: r3_r4
        ip: 10.0.34.1/30
      - network: r3_core
        ip: 10.0.35.1/30
    frr:
      enabled: true
      protocol: ospf
      router_id: 3.3.3.3
      area: 0

  r4:
    type: router
    interfaces:
      - network: r2_r4
        ip: 10.0.24.2/30
      - network: r3_r4
        ip: 10.0.34.2/30
      - network: r4_core
        ip: 10.0.45.1/30
    frr:
      enabled: true
      protocol: ospf
      router_id: 4.4.4.4
      area: 0

  core:
    type: router
    interfaces:
      - network: r2_core
        ip: 10.0.25.2/30
      - network: r3_core
        ip: 10.0.35.2/30
      - network: r4_core
        ip: 10.0.45.2/30
      - network: dmz_public
        ip: 10.30.1.1/24
      - network: lan_attackers
        ip: 10.20.1.1/24
    frr:
      enabled: true
      protocol: ospf
      router_id: 5.5.5.5
      area: 0
